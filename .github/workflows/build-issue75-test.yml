name: Build issue 75 test plugin

on:
  push:
    branches:
      - issue-75-burst-fov-test
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64
      - name: Build plugin
        shell: pwsh
        run: cmake --build build --config Release --target plugin
      - name: Upload plugin.dll
        uses: actions/upload-artifact@v4
        with:
          name: genshin-unlock-issue75-test-plugin
          path: build/Release/plugin.dll
          if-no-files-found: error
